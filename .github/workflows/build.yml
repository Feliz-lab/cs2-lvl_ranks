name: Build AMBuild Plugin

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - created
  workflow_dispatch:

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pisex/ubuntu20:latest

    env:
      HL2SDK_ROOT: "${{ github.workspace }}/external"
      MMS_PATH: "${{ github.workspace }}/external/metamod-source"
      MANIFEST_PATH: "${{ github.workspace }}/external/metamod-source/hl2sdk-manifests"

    steps:
      - name: Generate build number
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: buildnumber
        uses: onyxmueller/build-tag-number@v1
        with:
          token: ${{secrets.github_token}}

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qy
          apt-get install -y git clang-10 clang++-10 binutils python3 python3-pip zip

          python3 -m pip install --upgrade pip importlib-metadata
          python3 -m pip install setuptools==45.2.0

          git clone https://github.com/alliedmodders/ambuild.git ambuild
          cd ambuild
          pip3 install .
          cd ..

          mkdir -p external
          cd external

          # Pin external SDKs to a mutually consistent pre-2025-08-07 state:
          #  * hl2sdk@cs2 later removed tier1/generichash.cpp (dc8e7324, 2026-07-17),
          #    which this plugin's AMBuildScript still compiles.
          #  * hl2sdk@cs2 renamed NetworkStateChanged_t -> NetworkStateChangedData
          #    (510a1e4e, 2025-08-07); pisex/SchemaEntity still uses the old name.
          # d03fadc6 (2025-08-06) is the last cs2 commit before that rename and still
          # has generichash.cpp. metamod-source 5a282eb8 is the matching master state.
          git clone --recursive https://github.com/alliedmodders/metamod-source.git
          git -C metamod-source checkout 5a282eb8fca9
          git -C metamod-source submodule update --init --recursive

          git clone --recursive https://github.com/alliedmodders/hl2sdk.git hl2sdk-cs2
          git -C hl2sdk-cs2 checkout d03fadc6df75
          git -C hl2sdk-cs2 submodule update --init --recursive

          cd ../..

          git clone https://github.com/pisex/SchemaEntity.git
          
      - name: Configure and build plugin
        run: |
          mkdir build
          cd build
          python3 ../configure.py -s cs2 --targets x86_64 --enable-optimize --hl2sdk-manifests=./hl2sdk-manifests --mms_path=$MMS_PATH --hl2sdk-root=$HL2SDK_ROOT
          ambuild

      - name: Package addon into ZIP
        run: |
          cd build/package/addons
          zip -r "${{ github.event.repository.name }}.zip" .
          mv "${{ github.event.repository.name }}.zip" "${GITHUB_WORKSPACE}/"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cs2-lvl_ranks-addons
          path: build/package/addons/**

      - name: Create GitHub Release
        if: ${{ github.event_name == 'release' }}
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.head_commit.message }}
          files: ${{ github.workspace }}/${{ github.event.repository.name }}.zip
