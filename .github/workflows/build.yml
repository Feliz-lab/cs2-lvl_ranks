name: Build

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Linux x86_64
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/alliedmodders/build-containers/debian11-clang22:latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: levels_ranks

      - name: Checkout Metamod:Source
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: master
          path: mmsource
          submodules: recursive

      # Latest hl2sdk-cs2 == what a SteamCMD-updated live CS2 server actually runs.
      - name: Checkout HL2SDK (cs2)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: cs2
          path: hl2sdk/hl2sdk-cs2

      # levels_ranks bundles pisex/SchemaEntity's schemasystem.cpp. That repo is
      # unmaintained and still uses the pre-2025-08 name NetworkStateChanged_t;
      # current hl2sdk-cs2 calls it NetworkStateChangedData. Patch it in place.
      - name: Checkout SchemaEntity
        uses: actions/checkout@v4
        with:
          repository: pisex/SchemaEntity
          ref: main
          path: SchemaEntity

      - name: Patch SchemaEntity for current hl2sdk
        run: |
          cd SchemaEntity
          sed -i 's/NetworkStateChanged_t/NetworkStateChangedData/g' schemasystem.cpp
          grep -n 'NetworkStateChangedData' schemasystem.cpp || true

      - name: Configure
        working-directory: levels_ranks
        run: |
          mkdir build
          cd build
          python3 ../configure.py \
            --enable-optimize \
            --sdks=cs2 \
            --targets=x86_64 \
            --mms_path="$GITHUB_WORKSPACE/mmsource" \
            --hl2sdk-manifests="$GITHUB_WORKSPACE/levels_ranks/hl2sdk-manifests" \
            --hl2sdk-root="$GITHUB_WORKSPACE/hl2sdk"

      - name: Build
        working-directory: levels_ranks/build
        run: ambuild

      # A .so may keep symbols unresolved for dynamic resolution against the CS2
      # server at dlopen() time, but an unexpected one there means a load failure
      # on the live server (this bit us with g_bUpdateStringTokenDatabase).
      - name: List undefined symbols
        working-directory: levels_ranks/build/package/addons/levels_ranks
        run: nm -D --undefined-only levels_ranks.so | c++filt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: levels_ranks-linux-x86_64
          path: levels_ranks/build/package
